services:
  rag-api:
    build: .
    container_name: enterprise-rag-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./api_db:/app/api_db        # ChromaDB persistence
      - ./models_cache:/root/.cache  # HuggingFace model cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3